<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROWESS</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,600..96,900;1,6..96,400&family=Inter:wght@200;300;400;500;600&family=Antonio:wght@700&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        bodoni: ['"Bodoni Moda"', 'serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                    keyframes: {
                        breathe: {
                            '0%': { backgroundSize: '100% 100%, 100% 100%', filter: 'contrast(100%)' },
                            '100%': { backgroundSize: '105% 105%, 102% 102%', filter: 'contrast(110%)' },
                        },
                        revealUp: {
                            to: { opacity: '1', transform: 'translateY(0)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                            '50%': { transform: 'translateY(-20px) rotate(2deg)' }
                        }
                    },
                    animation: {
                        breathe: 'breathe 20s infinite alternate ease-in-out',
                        revealUp: 'revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        float: 'float 6s ease-in-out infinite'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050505;
            color: #e0e0e0;
            cursor: none; /* Custom cursor */
            overflow-x: hidden;
        }

        /* BACKGROUND: RED FINGERPRINT (Hero) */
        .fingerprint-bg {
          background-color: #ce1b1b;
          background-image: url("data:image/svg+xml,%3Csvg width='100%25' height='100%25' viewBox='0 0 1000 1000' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3Cpattern id='fingerprint' x='0' y='0' width='100' height='100' patternUnits='userSpaceOnUse'%3E%3Cpath d='M50 50 Q 60 20, 90 50 T 50 90 T 10 50 T 50 10' fill='none' stroke='black' stroke-width='0.5' opacity='0.4'/%3E%3Cpath d='M50 50 Q 70 10, 100 50 T 50 100 T 0 50 T 50 0' fill='none' stroke='black' stroke-width='0.8' opacity='0.3'/%3E%3Cpath d='M20 20 Q 50 0, 80 20 T 80 80 T 20 80 T 20 20' fill='none' stroke='black' stroke-width='1' opacity='0.5'/%3E%3C/pattern%3E%3C/defs%3E%3Crect width='2000' height='2000' fill='url(%23fingerprint)' /%3E%3C/svg%3E"),
          repeating-radial-gradient( circle at 50% 50%, transparent 0, transparent 4px, rgba(0,0,0,0.8) 5px, rgba(0,0,0,0.8) 6px );
          background-blend-mode: multiply;
          animation: breathe 20s infinite alternate ease-in-out;
        }

        /* TEXT COMPRESSION */
        .ultra-condensed {
           transform: scaleY(3.5) scaleX(0.7);
           display: inline-block;
           transform-origin: center;
           will-change: transform;
        }

        /* CURSOR BLEND MODE */
        .cursor-blend {
          mix-blend-mode: difference;
        }

        .reveal-up-initial {
           opacity: 0;
           transform: translateY(20px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ICONS (SVGs)
        const ArrowDown = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <polyline points="19 12 12 19 5 12"></polyline>
            </svg>
        );

        const Plus = ({ size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        const Minus = ({ size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        );

        // MAIN COMPONENT
        const App = () => {
          const [scrollY, setScrollY] = useState(0);
          const [mousePos, setMousePos] = useState({ x: -100, y: -100 });
          const [cursorVariant, setCursorVariant] = useState("default");
          const [loading, setLoading] = useState(true);
          
          const cursorRef = useRef({ x: -100, y: -100 });
          const cursorDotRef = useRef({ x: -100, y: -100 });
          const requestRef = useRef();
          const scrollSpeedRef = useRef(0);
          const lastScrollY = useRef(0);

          useEffect(() => {
            const timer = setTimeout(() => setLoading(false), 1000);
            return () => clearTimeout(timer);
          }, []);

          useEffect(() => {
            const handleScroll = () => {
              const currentScroll = window.scrollY;
              scrollSpeedRef.current = currentScroll - lastScrollY.current;
              lastScrollY.current = currentScroll;
              setScrollY(currentScroll);
            };

            const handleMouseMove = (e) => setMousePos({ x: e.clientX, y: e.clientY });
            
            window.addEventListener('scroll', handleScroll, { passive: true });
            window.addEventListener('mousemove', handleMouseMove);
            
            const animate = () => {
              const dx = mousePos.x - cursorRef.current.x;
              const dy = mousePos.y - cursorRef.current.y;
              cursorRef.current.x += dx * 0.12;
              cursorRef.current.y += dy * 0.12;
              
              const dotDx = mousePos.x - cursorDotRef.current.x;
              const dotDy = mousePos.y - cursorDotRef.current.y;
              cursorDotRef.current.x += dotDx * 0.9;
              cursorDotRef.current.y += dotDy * 0.9;
              
              const cursorRing = document.getElementById('cursor-ring');
              const cursorDot = document.getElementById('cursor-dot');
              
              if (cursorRing) {
                const scale = cursorVariant === 'hover' ? 1.5 : 1;
                const opacity = cursorVariant === 'hover' ? 0.5 : 1;
                cursorRing.style.transform = `translate3d(${cursorRef.current.x}px, ${cursorRef.current.y}px, 0) translate(-50%, -50%) scale(${scale})`;
                cursorRing.style.opacity = opacity;
              }
              
              if (cursorDot) {
                cursorDot.style.transform = `translate3d(${cursorDotRef.current.x}px, ${cursorDotRef.current.y}px, 0) translate(-50%, -50%)`;
              }

              const heroText = document.getElementById('kinetic-text');
              if (heroText) {
                const skew = Math.min(Math.max(scrollSpeedRef.current * 0.15, -10), 10);
                scrollSpeedRef.current *= 0.9; 
                heroText.style.transform = `skewX(${-skew}deg)`;
              }
              
              requestRef.current = requestAnimationFrame(animate);
            };
            requestRef.current = requestAnimationFrame(animate);

            return () => {
              window.removeEventListener('scroll', handleScroll);
              window.removeEventListener('mousemove', handleMouseMove);
              cancelAnimationFrame(requestRef.current);
            };
          }, [mousePos, cursorVariant]);

          const textEnter = () => setCursorVariant("hover");
          const textLeave = () => setCursorVariant("default");

          return (
            <div className={`min-h-screen font-sans selection:bg-black selection:text-red-600 transition-opacity duration-700 ${loading ? 'opacity-0' : 'opacity-100'}`}>
              
              {/* CURSOR */}
              <div id="cursor-ring" className="fixed top-0 left-0 pointer-events-none z-[9999] hidden md:block cursor-blend">
                 <div className="w-8 h-8 rounded-full border border-white/50 transition-all duration-150 ease-out"></div>
              </div>
              <div id="cursor-dot" className="fixed top-0 left-0 pointer-events-none z-[9999] hidden md:block cursor-blend">
                 <div className="w-2 h-2 rounded-full bg-red-500 shadow-[0_0_10px_rgba(255,0,0,0.8)]"></div>
              </div>

              {/* NAV */}
              <nav className="fixed top-0 w-full z-50 flex justify-between items-center px-8 py-6 mix-blend-difference text-white">
                <div 
                    onMouseEnter={textEnter} 
                    onMouseLeave={textLeave} 
                    className="font-bodoni font-black tracking-widest text-sm cursor-pointer hover:text-red-500 transition-colors"
                >
                    PROWESS
                </div>
                <button 
                    onMouseEnter={textEnter} 
                    onMouseLeave={textLeave}
                    className="text-[10px] tracking-[0.3em] border border-white/40 px-6 py-2 hover:bg-white hover:text-black transition-all duration-300 uppercase bg-black/20 backdrop-blur-sm group overflow-hidden relative"
                >
                  <span className="relative z-10">Menu</span>
                  <div className="absolute inset-0 bg-white transform translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out z-0"></div>
                </button>
              </nav>

              {/* HERO */}
              <section className="relative h-screen w-full flex flex-col justify-center items-center overflow-hidden fingerprint-bg">
                <div className="relative z-10 w-full px-4 flex justify-center items-center h-full perspective-[1000px]">
                  <h1 
                    id="kinetic-text" 
                    className="font-bodoni font-black text-[#080808] leading-none select-none flex justify-center items-center w-full transition-transform duration-75 ease-out origin-center"
                    style={{ willChange: 'transform' }}
                  >
                     <span className="ultra-condensed text-[20vw] md:text-[25vw] relative">
                        PROWESS
                        <span className="absolute -top-4 -right-8 md:-top-12 md:-right-16 w-8 h-8 md:w-16 md:h-16 text-red-900 animate-pulse block">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2C8 2 4 6 4 10C4 13 6 15 8 16C8 16 8 13 10 11C10 11 9 14 10 16C12 18 14 18 16 16C18 14 20 10 12 2Z" />
                            </svg>
                        </span>
                     </span>
                  </h1>
                </div>

                <div className="absolute bottom-12 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 mix-blend-difference text-white opacity-80 animate-bounce">
                   <span className="text-[9px] tracking-[0.3em] uppercase">Scroll</span>
                   <ArrowDown className="w-4 h-4" />
                </div>
              </section>

              {/* IGNITION CARD */}
              <section className="min-h-screen py-32 flex items-center justify-center relative z-20 px-4 bg-[#050505]">
                <div 
                    className="w-full max-w-5xl bg-[#080808] border border-white/5 p-12 md:p-24 relative overflow-hidden shadow-2xl group"
                    onMouseEnter={textEnter}
                    onMouseLeave={textLeave}
                >
                  <div className="relative w-full h-80 flex items-center justify-center mb-16 perspective-1000">
                     <svg width="0" height="0">
                       <defs>
                         <linearGradient id="glossyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                           <stop offset="0%" stopColor="#4a0000" />
                           <stop offset="20%" stopColor="#990000" />
                           <stop offset="40%" stopColor="#ff1a1a" />
                           <stop offset="60%" stopColor="#990000" />
                           <stop offset="100%" stopColor="#4a0000" />
                         </linearGradient>
                         <filter id="plasticGlow" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
                            <feOffset in="blur" dx="0" dy="4" result="offsetBlur"/>
                            <feSpecularLighting in="blur" surfaceScale="5" specularConstant="1" specularExponent="30" lightingColor="#ffcccc" result="specOut">
                                <fePointLight x="-5000" y="-10000" z="20000"/>
                            </feSpecularLighting>
                            <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut"/>
                            <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
                         </filter>
                       </defs>
                     </svg>

                     <svg viewBox="0 0 400 300" className="w-full h-full max-w-lg drop-shadow-[0_20px_50px_rgba(0,0,0,0.8)] transition-transform duration-700 hover:scale-105">
                       <path 
                         d="M 80 150 C 80 80, 150 50, 200 50 C 250 50, 320 80, 320 150 C 320 180, 300 220, 280 240 L 280 260 C 320 230, 360 180, 360 150 C 360 60, 260 10, 200 10 C 140 10, 40 60, 40 150 C 40 180, 80 230, 120 260 L 120 240 C 100 220, 80 180, 80 150 Z" 
                         fill="url(#glossyGradient)" 
                         filter="url(#plasticGlow)"
                       />
                       <path d="M 200 40 L 205 90 L 200 140 L 195 90 Z" fill="#7f1d1d" filter="url(#plasticGlow)" />
                     </svg>
                  </div>

                  <div className="relative z-10 text-center">
                     <RevealOnScroll>
                        <p className="font-bodoni italic text-xl md:text-2xl text-red-800/80 mb-6 font-light tracking-wide">December</p>
                        <h2 className="font-bodoni text-7xl md:text-9xl text-[#f5f5f5] mb-8 tracking-[-0.05em] uppercase scale-y-110 drop-shadow-2xl cursor-default">
                            Ignition
                        </h2>
                        <div className="w-12 h-1 bg-red-900 mx-auto mb-8 shadow-[0_0_15px_rgba(200,0,0,0.5)]"></div>
                        <p className="font-inter text-sm md:text-base text-gray-500 max-w-lg mx-auto leading-relaxed">
                            The House reveals itself in form for the first time in history, embodying the timeless custodians of humanity's aesthetic destiny.
                        </p>
                     </RevealOnScroll>

                    <div className="mt-20 pt-8 border-t border-white/10 flex items-center justify-between text-[10px] tracking-[0.25em] uppercase font-bold text-gray-600">
                      <span className="text-red-800 animate-pulse">Bare Witness</span>
                      
                      <div className="flex-1 mx-8 relative h-10 flex items-center justify-center cursor-pointer group/timeline">
                        <div className="absolute w-full h-px bg-white/10 group-hover/timeline:bg-white/30 transition-colors"></div>
                        <div className="w-full flex justify-between absolute px-1 pointer-events-none">
                          {[...Array(12)].map((_, i) => (
                            <div key={i} className={`w-px transition-all duration-300 origin-bottom ${i === 11 ? 'h-3 bg-red-800' : 'h-1.5 bg-white/10 group-hover/timeline:h-4 group-hover/timeline:bg-white/40'}`}></div>
                          ))}
                        </div>
                        <div className="absolute right-0 w-2.5 h-2.5 bg-red-800 rounded-full shadow-[0_0_10px_rgba(200,0,0,0.8)] z-10 transition-transform group-hover/timeline:scale-[2] group-hover/timeline:shadow-[0_0_20px_red]"></div>
                      </div>

                      <span>2025</span>
                    </div>
                  </div>
                </div>
              </section>

              {/* TYPOGRAPHY SECTION */}
              <section className="py-32 bg-[#020202] relative overflow-hidden border-t border-white/5">
                <div className="max-w-screen-xl mx-auto px-6 relative z-10">
                  <RevealOnScroll>
                     <h3 className="font-bodoni text-5xl md:text-7xl leading-[1.1] text-white/90 mb-2 tracking-tight">
                       "Turn my idea into a
                     </h3>
                     <div className="flex items-center gap-4 group cursor-pointer" onMouseEnter={textEnter} onMouseLeave={textLeave}>
                       <div className="h-px w-0 bg-red-900 group-hover:w-24 transition-all duration-700 ease-out"></div>
                       <h3 className="font-bodoni text-5xl md:text-7xl leading-[1.1] italic text-red-800 tracking-tight group-hover:text-red-600 transition-colors duration-500">
                         cultural movement."
                       </h3>
                     </div>
                  </RevealOnScroll>
                </div>
              </section>

              {/* INPUT SECTION */}
              <section className="min-h-[70vh] flex flex-col items-center justify-center bg-[#020202] px-4 relative">
                <div className="w-full max-w-3xl relative z-10 text-center">
                   <RevealOnScroll>
                     <label className="block font-bodoni text-4xl md:text-6xl mb-16 text-white/90 leading-tight tracking-tight">
                         Describe the mark you<br/>
                         <span className="italic text-gray-600 font-serif">want to make on the world..</span>
                     </label>
                   </RevealOnScroll>

                   <div className="relative group mx-auto max-w-xl">
                     <input 
                       type="text" 
                       placeholder="think deeply about the words you choose"
                       onMouseEnter={textEnter}
                       onMouseLeave={textLeave}
                       className="w-full bg-transparent border-none text-center font-inter text-lg md:text-xl text-white placeholder:text-gray-800 placeholder:italic placeholder:font-bodoni focus:outline-none pb-6 relative z-10 transition-colors focus:placeholder:text-transparent"
                     />
                     <div className="absolute bottom-0 left-0 w-full h-px bg-white/10"></div>
                     <div className="absolute bottom-0 left-0 w-0 h-[2px] bg-red-800 transition-all duration-700 group-hover:w-full group-focus-within:w-full box-shadow-[0_0_20px_red]"></div>
                     
                     <div className="mt-20 flex justify-center">
                       <button 
                          onMouseEnter={textEnter} 
                          onMouseLeave={textLeave}
                          className="w-16 h-16 rounded-full border border-white/10 flex items-center justify-center text-white/40 hover:bg-[#e0e0e0] hover:text-black hover:border-[#e0e0e0] hover:scale-110 transition-all duration-500 group"
                        >
                         <ArrowDown className="w-5 h-5 group-hover:translate-y-1 transition-transform" />
                       </button>
                     </div>
                   </div>
                </div>
              </section>

              {/* FAQ SECTION */}
              <section className="py-32 px-6 md:px-12 max-w-7xl mx-auto flex flex-col md:flex-row gap-20 border-t border-white/5 bg-[#050505]">
                <div className="md:w-1/3">
                   <RevealOnScroll>
                     <h3 className="font-bodoni text-4xl md:text-5xl mb-6 text-white leading-tight">
                       Things you're<br/>
                       <span className="italic text-gray-600">wanting to</span><br/>
                       know now
                     </h3>
                     <div className="w-8 h-1 bg-red-800"></div>
                   </RevealOnScroll>
                </div>

                <div className="md:w-2/3 flex flex-col gap-6">
                   <AccordionItem title="What is PROWESS?" isOpen={true}>
                     PROWESS is the timeless custodian of humanity's aesthetic destiny. We exist to build what has not been imagined yet, drawing from the primal instinct in all creators to pursue ideas that feel impossible until they become inevitable.
                   </AccordionItem>
                   <AccordionItem title="What can PROWESS do for me?" />
                   <AccordionItem title="How will PROWESS do this?" />
                   <AccordionItem title="How do you ensure what PROWESS makes sells?" />
                </div>
              </section>

              {/* FOOTER */}
              <footer className="py-24 bg-[#050505] border-t border-white/5 relative overflow-hidden flex flex-col items-center justify-center">
                <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-red-950/20 via-black to-black opacity-50 animate-pulse"></div>
                <h2 
                    onMouseEnter={textEnter}
                    onMouseLeave={textLeave}
                    className="relative z-10 font-bodoni text-[15vw] leading-none text-[#111] hover:text-[#1a0505] transition-colors duration-1000 select-none cursor-default tracking-widest mix-blend-color-dodge hover:scale-105 transform duration-1000 ease-out"
                >
                  WITNESS
                </h2>
                <div className="relative z-10 mt-12 flex items-center gap-2 text-[10px] tracking-[0.3em] font-inter text-gray-700 uppercase">
                   <p>© 2025 Prowess House</p>
                   <span className="mx-2 text-red-900">•</span>
                   <p>Privacy Policy</p>
                </div>
              </footer>

            </div>
          );
        };

        const RevealOnScroll = ({ children }) => {
          const [isVisible, setIsVisible] = useState(false);
          const ref = useRef(null);

          useEffect(() => {
            const observer = new IntersectionObserver(([entry]) => {
              if (entry.isIntersecting) setIsVisible(true);
            }, { threshold: 0.1 });
            if (ref.current) observer.observe(ref.current);
            return () => observer.disconnect();
          }, []);

          return (
            <div ref={ref} className={`transition-all duration-1000 ease-[cubic-bezier(0.25,1,0.5,1)] ${isVisible ? 'opacity-100 translate-y-0' : 'reveal-up-initial'}`}>
              {children}
            </div>
          );
        };

        const AccordionItem = ({ title, children, isOpen = false }) => {
          const [open, setOpen] = useState(isOpen);

          return (
            <div className="border-b border-white/10 pb-6 group">
              <button 
                onClick={() => setOpen(!open)}
                className="w-full flex items-center justify-between text-left group-hover:pl-2 transition-all duration-300"
              >
                <span className="font-bodoni text-2xl md:text-3xl text-gray-400 group-hover:text-red-600 transition-colors">
                  {title}
                </span>
                <span className="text-white/30 group-hover:text-red-600 transition-colors">
                  {open ? <Minus /> : <Plus />}
                </span>
              </button>
              
              <div 
                className={`overflow-hidden transition-all duration-500 ease-in-out ${open ? 'max-h-96 opacity-100 mt-4' : 'max-h-0 opacity-0'}`}
              >
                <p className="font-inter text-gray-500 leading-loose text-sm md:text-base max-w-2xl">
                  {children || "Content reveals itself to those who seek it."}
                </p>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
